# ==============================================================================
# ERPlora Shell (ERPlora/app) — tests of the thin client
# ==============================================================================
#
# This workflow runs `cargo test -p erplora-tauri -p tauri-plugin-erplora-android
# -p erplora-peripherals` (the three crates of this repo's workspace), only when the app changes.
#
# On the three desktop systems the app ships to: Linux, Windows and macOS, so a change that breaks
# one of them is found on its pull request and not while cutting a release. Windows and macOS need
# no system packages (WebView2 / WKWebView ship with the OS image, same as the release job): only
# the toolchain and the cache.
#
# It also runs the KOTLIN unit tests of the Android plugin, on Linux only: they are JVM tests, the
# runner's OS adds nothing. The permission policy and the SPP transport are Kotlin. They run
# against the minimal root `crates/tauri-plugin-erplora-android/android-tests/`, without `:app` and
# therefore without NDK or tauri-cli: seconds, not the release job.
#
# It also fires on a change to ANY workflow (`.github/workflows/*.yml`): `release_runner_assumptions.rs`
# reads every one of them, so a guard added to another workflow can turn this suite red, and only a
# run of this workflow would say so.
#
# It is also CALLED by `tauri-release.yml` (`workflow_call`): the release builds nothing until these
# tests are green, so nothing is ever published on red.
#
# Its `scripts` job runs `actionlint` over every workflow and EVERY `scripts/*.test.sh` and
# `scripts/tests/*.test.sh`: this workflow's own contract, the rules of both release gates, the
# MSIX packaging, the apt lock, the Android SDK setup, the Play reviewer preflight and the check
# that the code cites nothing its reader does not have.
#
# Contract: `scripts/tests/test-shell-workflow.test.sh`, run by the `scripts` job below.
# ==============================================================================

name: Shell tests (Tauri thin client)

on:
  push:
    branches: [main]
    paths:
      # The app is the whole repo: its crate, the bundled page, the workspace manifests and both
      # library crates it compiles against.
      - "src-tauri/**"
      - "shell-dist/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/peripherals/**"
      - "crates/tauri-plugin-erplora-android/**"
      - ".github/workflows/test-shell.yml"
      # Its contract: a PR that only touches the test must run it.
      - "scripts/tests/test-shell-workflow.test.sh"
      # `release_runner_assumptions.rs` reads EVERY workflow (see the header), and the `scripts`
      # job lints them all: any of them can turn this suite red. That includes `tauri-release.yml`,
      # whose APK permission check `android_local_network.rs` guards.
      - ".github/workflows/*.yml"
      # Every script and its test: the `scripts` job runs all of them (both release gates, the
      # MSIX packer, the apt wrapper, the Play preflight…) and the `test` job the Kotlin runner.
      - "scripts/**"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      # The app is the whole repo: its crate, the bundled page, the workspace manifests and both
      # library crates it compiles against.
      - "src-tauri/**"
      - "shell-dist/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/peripherals/**"
      - "crates/tauri-plugin-erplora-android/**"
      - ".github/workflows/test-shell.yml"
      # Its contract: a PR that only touches the test must run it.
      - "scripts/tests/test-shell-workflow.test.sh"
      # `release_runner_assumptions.rs` reads EVERY workflow (see the header), and the `scripts`
      # job lints them all: any of them can turn this suite red. That includes `tauri-release.yml`,
      # whose APK permission check `android_local_network.rs` guards.
      - ".github/workflows/*.yml"
      # Every script and its test: the `scripts` job runs all of them (both release gates, the
      # MSIX packer, the apt wrapper, the Play preflight…) and the `test` job the Kotlin runner.
      - "scripts/**"
  workflow_dispatch:
  # `tauri-release.yml` calls this workflow and builds only after it is green.
  workflow_call:

concurrency:
  # `github.workflow` is the CALLER's name when `tauri-release.yml` calls this workflow: without it
  # the release's call and the push's own run share one group, and a third push would cancel the
  # release's pending tests (one pending run per group).
  group: test-shell-${{ github.workflow }}-${{ github.ref }}
  # A PR's newer head cancels its older run; a push always finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # `setup-android` downloads the command line tools from `dl.google.com`, and that host can answer
  # **404 over IPv6**, which Node prefers. It is the machine, not the step: it happens to any JS
  # action that downloads from Google.
  NODE_OPTIONS: --dns-result-order=ipv4first

jobs:
  # ── Workflows and scripts: actionlint + every script test, once, on Linux ──────────────────
  #
  # Bash and Python rules that do not depend on the OS: this workflow's contract, the release's
  # contract, both release gates (version and publication), the MSIX packer, the apt lock wrapper,
  # the Android SDK setup and the Play reviewer preflight. By GLOB, not by name: a new
  # `*.test.sh` runs the day it is committed, and a list of names forgets the next file.
  scripts:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: actionlint + script tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pinned version + official downloader (a static Go binary, no package manager). Bump the
      # version deliberately, not via a moving tag.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -euo pipefail
          bash <(curl -fsSL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") \
            "${ACTIONLINT_VERSION}" "${RUNNER_TEMP}"

      # A workflow GitHub cannot parse "fails" with 0 jobs and no log. `-shellcheck= -pyflakes=`:
      # the verdict must not depend on what the runner happens to have installed.
      - name: actionlint (all workflows)
        run: '"${RUNNER_TEMP}/actionlint" -color -shellcheck= -pyflakes='

      # Every test runs and every red is listed: stopping at the first one hides the others for a
      # whole round trip.
      - name: Script tests (scripts/*.test.sh, scripts/tests/*.test.sh)
        run: |
          set -uo pipefail
          failed=""
          for t in scripts/*.test.sh scripts/tests/*.test.sh; do
            echo "::group::$t"
            if ! bash "$t"; then
              failed="$failed $t"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            for t in $failed; do echo "::error::$t failed"; done
            exit 1
          fi
          echo "every script test passed"

  test:
    # Draft = no CI. PRs are born as drafts: they are reviewed and fixed WITHOUT runs in flight and
    # the suite runs ONCE, when they are marked ready (ready_for_review), instead of once per
    # re-push during the review.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: cargo test -p erplora-tauri (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    # Budgets per system, from cold (no cache): Linux compiles the Tauri stack and then runs the
    # Kotlin tests; Windows (MSVC linker, NTFS) and macOS compile the same stack noticeably slower
    # on GitHub's images. A budget is a ceiling against a hung run, not an estimate.
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      # One red system must not cancel the other two: knowing that macOS builds while Windows
      # does not is the whole point of the matrix.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
            timeout: 30
          - os: windows-latest
            label: windows
            timeout: 45
          - os: macos-latest
            label: macos
            timeout: 40

    env:
      RUSTFLAGS: "-C debuginfo=0"
      CARGO_TERM_COLOR: always

    steps:
      # Windows runners check out with `core.autocrlf=true`. Several tests read this repo's own
      # sources (`include_str!("lib.rs")`, the workflows, the Gradle files) and split them on "\n",
      # so they would test CRLF bytes that Linux, macOS and the repository never hold.
      - name: Check out with LF on Windows
        if: matrix.label == 'windows'
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4

      # Tauri v2 system deps on Linux (webview + GTK). No appindicator/librsvg: the shell uses no
      # tray and nothing is bundled here. Through the apt-lock wrapper: another job on a shared
      # runner may be holding apt's lock. The condition reads the LABEL, not `matrix.os`: on a
      # self-hosted runner `matrix.os` is not `ubuntu-latest`.
      - name: System deps (webkit2gtk + GTK)
        if: matrix.label == 'linux'
        run: |
          bash scripts/ci/apt-lock-retry.sh sudo apt-get update
          bash scripts/ci/apt-lock-retry.sh sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev pkg-config

      # `rustup` ships with GitHub's images, but on a self-hosted runner it is one more file that
      # something can delete (see `cache-bin: false` below). `shell: bash`: Windows runs `run:`
      # under PowerShell by default.
      - name: Toolchain (rust-toolchain.toml)
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            echo "rustup missing on this runner — installing it (touches neither PATH nor toolchains)"
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --no-modify-path --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup show

      # 🔴 `cache-bin: false` is NOT an optimisation. By default this action caches
      # `$CARGO_HOME/bin`, and its `Post` step CLEANS it («... Cleaning cargo/bin ...»), deleting
      # the `rustup` binary and leaving the 13 shims (`cargo`, `rustc`, …) pointing at nothing.
      # On a GitHub runner it does not matter: the machine is thrown away with the job. On a
      # self-hosted runner it persists, so the NEXT job — any job, any repo — dies with
      # `rustup: command not found`.
      #
      # 🔴 `save-if` off on a self-hosted runner, and it is not an optimisation either. The same
      # `Post` also runs `cleanRegistry`, which `rmRF`s every non-`-sys` directory under
      # `~/.cargo/registry/src`. Two slots of one runner share ONE `$HOME`, so that delete lands on
      # whatever the OTHER slot is compiling. `save-if: false` returns BEFORE
      # cleaning anything (rust-cache `save.ts`), so the restore still works and hosted runners —
      # which die with the job — still save. The cache key carries the OS, so the three systems
      # never share an entry.
      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          save-if: ${{ runner.environment != 'self-hosted' }}

      # `--no-fail-fast`: every test binary reports, not only the first red one — on a matrix of
      # three systems, one red per round trip is how a Windows-only failure takes an afternoon.
      # This is the only place the tests of `erplora-peripherals` run.
      - name: cargo test -p erplora-tauri
        run: cargo test --no-fail-fast -p erplora-tauri -p tauri-plugin-erplora-android -p erplora-peripherals

      # ── Kotlin tests of the Android plugin — Linux only ───────────────────────────────────
      #
      # The `cargo test` above is RUST. Which permission is requested at each API level and how an
      # SPP printer is spoken to live in KOTLIN, and the only other place these tests run is the
      # `build-android` job of `tauri-release.yml`, on a release.
      #
      # No Android build is paid for: `android-tests/` is a minimal Gradle root without `:app`, so
      # no NDK, no tauri-cli and no Rust for four triples.
      - name: Setup JDK 17
        if: matrix.label == 'linux'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Only `platform-tools`: the action's default is `tools platform-tools`, and Google
      # retired the legacy `tools` package — `sdkmanager` exits 1 on it and takes the job down
      # with it. Nothing here uses `tools`.
      - name: Setup Android SDK
        if: matrix.label == 'linux'
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools

      # Only the platform and the build-tools: the NDK is for compiling Rust to Android and no
      # Rust is compiled for Android here.
      - name: Android platform 36 (no NDK)
        if: matrix.label == 'linux'
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      # After `cargo test`: the script takes `tauri`'s Kotlin SDK from the crate already UNPACKED
      # in the registry, and the build above is what unpacks it.
      - name: Kotlin unit tests (permissions plugin + SPP)
        if: matrix.label == 'linux'
        run: ./scripts/kotlin-plugin-tests.sh
