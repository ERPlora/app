# ==============================================================================
# ERPlora Shell (ERPlora/app) — size and function limits of the code
# ==============================================================================
#
# Runs `scripts/ci/file-size.sh` and `scripts/ci/function-limits.sh` on EVERY pull request and
# every push to `main`, whatever the change touches. `test-shell.yml` only runs when certain trees
# change, so a big file added in another folder or a new crate would go unchecked there.
#
# Seconds, not minutes: no cargo build. The whole history is checked out because both checks only
# let their exception lists shrink against the merge-base of HEAD and `main`.
#
# Contract: `scripts/tests/code-limits-workflow.test.sh`, run by the `scripts` job of
# `test-shell.yml`.
# ==============================================================================

name: Code size and function limits

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: code-limits-${{ github.ref }}
  # A PR's newer head cancels its older run; a push always finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  limits:
    # Draft = no CI, as in `test-shell.yml`: the run comes when the PR is marked ready.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: file size + function limits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: File size (scripts/ci/file-size.sh)
        run: bash scripts/ci/file-size.sh

      - name: Function limits (scripts/ci/function-limits.sh)
        run: bash scripts/ci/function-limits.sh
