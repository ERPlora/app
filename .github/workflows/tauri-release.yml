# ==============================================================================
# ERPlora app (Tauri) — release on push to main
# ==============================================================================
#
# The installable app (this repo, Tauri v2 thin client). The bundle does NOT carry the hub UI:
# `frontendDist` packs the committed fallback page `shell-dist/` and the real UI is served by the
# hub (ADR-0154/0159).
#
# WHEN IT RELEASES. Every push to `main` runs this workflow, and the first job (`version`,
# scripts/release-version.sh) decides. The version lives in ONE place, `version` in
# `src-tauri/tauri.conf.json`; a released version is marked by its tag `v<version>`:
#
#   tag `v<version>` exists           ─► every other job is skipped (docs/CI push: nothing ships)
#   missing, version > latest `v*`    ─► tests ─► build + build-android ─► collect (every installer
#                                        there? open the DRAFT release) ─► Microsoft Store, Google
#                                        Play, S3 ─► release gate ─► publish the draft = the tag
#   missing, version <= latest tag    ─► RED (the stores only take a higher version)
#   a draft `v<version>` of another   ─► RED: that publication already started — resume it with
#   run exists                           `gh run rerun <run> --failed`, or bump the version
#   workflow_dispatch                 ─► the same on `main`; on any other ref, or with
#                                        `-f publish=false`, it builds only (packaging check)
#
# To release: bump `version` in src-tauri/tauri.conf.json and push to `main`. The tag is created
# LAST, by `github-release`, once the release gate is green: a failed channel is retried with
# `gh run rerun --failed` (artifacts live 3 days); if code must change, bump the version again.
# The jobs are the `jobs:` list of this file — do not restate them here. Third-party actions are
# pinned by commit SHA (the version in a comment): this job holds the keystore, the store
# credentials and an AWS role.
#
# S3 LAYOUT (AWS, by OIDC; the SaaS reads `downloads/app/latest/latest.json`, saas-next
# `public/appdist.py`):
#   s3://$DOWNLOADS_BUCKET/downloads/app/
#   ├── latest/
#   │   ├── erplora-app-setup.exe   (Windows x64, NSIS — UNSIGNED)
#   │   ├── erplora-app.msi         (Windows x64, MSI — UNSIGNED)
#   │   ├── erplora-app.AppImage    (Linux x86_64)
#   │   ├── erplora-app.deb         (Linux x86_64, Debian/Ubuntu)
#   │   ├── erplora-app.dmg         (macOS, NOT notarized: no Apple Developer ID)
#   │   ├── erplora-app.apk         (Android, internal QA artefact: the public channel is Play)
#   │   └── latest.json             {"version","published_at"} — the ONLY thing that says what is here
#   └── v{version}/...
#
# `latest.json` is the source of truth of «the last published version» (hub#400): the SaaS serves
# it at `GET /api/v1/app/release/` and the installed app compares its own version with it. Without
# it there is no update channel and the fleet is orphaned.
#
# The bucket and the OIDC role are created by aws-next (PLAN-AWS ronda 18) and handed over as the
# repo Variables `AWS_DOWNLOADS_ROLE_ARN` and `DOWNLOADS_BUCKET` (+ `AWS_REGION`). Until both exist
# `upload-s3` warns and skips, the installers still reach the GitHub Release, and the channel must
# be declared pending (`s3` in `RELEASE_CHANNELS_PENDING`) for the gate to pass.
#
# Windows signing (ADR-0136): the MAIN Windows channel is Microsoft Store — an unsigned MSIX the
# Store re-signs after certification (no Authenticode cert, no SmartScreen, Store-managed updates).
# See `publish-store` + MICROSOFT-STORE.md. The NSIS/MSI are the secondary, UNSIGNED channel.
#
# Android is the SAME Tauri app under the one identity `com.erplora.app` (ADR-0160/0180/0196): this
# workflow builds the AAB and publishes it to Play (`publish-play`, hub#308). Runbook: GOOGLE-PLAY.md.
#
# Contract: scripts/tests/tauri-release-workflow.test.sh; wiring of the gates:
# src-tauri/tests/release_gate.rs; runner assumptions: src-tauri/tests/release_runner_assumptions.rs.
# ==============================================================================

name: Release app (Tauri)

on:
  # Every push to `main`: the `version` job decides whether it releases (the tag of the version
  # already exists → nothing runs). Release candidates never reach the stores: Store and Play
  # versions are monotonic and irreversible, so only a final X.Y.Z passes the gate.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      # `false` = check that packaging still works without publishing anything: `latest.json`
      # is what the whole fleet reads (hub#400), and a test run must never overwrite it.
      publish:
        description: "Publish (stores, S3, tag) when the version is new; false = build only"
        type: boolean
        default: true

# One release at a time, and a newer push NEVER cancels one in flight: cancelling between Play
# and the tag would leave a version published and untagged. The newer run waits, and when it
# starts the tag already exists, so it releases nothing. The group has NO ref in it: a dispatch on
# another branch (build only) queues behind a release of main instead of running next to it.
# GitHub keeps one PENDING run per group: a newer one replaces it (README, «CI/CD»).
concurrency:
  group: tauri-release
  cancel-in-progress: false

permissions:
  contents: read

# 🔴 `dl.google.com` answers 404 to `ci-runner-1` over IPv6 — for EVERY path of that host (checked
# on the machine: `curl -6` 404, `curl -4` 206 for the same URL). Node resolves AAAA first, so every
# JS action that downloads from Google takes the broken road: `Setup Android SDK` died with
# `HTTPError: Unexpected HTTP response: 404` for command line tools that EXIST (hub#878). This flips
# the resolution order for the Node processes we do not launch (the actions themselves). A no-op
# where there is no IPv6.
env:
  NODE_OPTIONS: --dns-result-order=ipv4first

jobs:

  # ── Does this push release? ──────────────────────────────────────────────────────────────────
  version:
    name: Version gate
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 5
    # `write` only to SEE draft releases: GitHub lists drafts to a token with push access alone, so
    # with `contents: read` the draft check below would find none and pass — failing open. This
    # job writes nothing.
    permissions:
      contents: write
    outputs:
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
      build: ${{ steps.decide.outputs.build }}
      release: ${{ steps.decide.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      # The tags come from the remote, not from the shallow checkout: a tag created by an earlier
      # run is on GitHub whatever this clone fetched. The DRAFT releases are the publications that
      # started and did not finish (`collect` opens one before the first channel, with the run that
      # opened it in a hidden `publishing-run` line). Only `refs/heads/main` publishes.
      - name: Is the version in tauri.conf.json new? (scripts/release-version.sh)
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUBLISH: ${{ inputs.publish }}
          REF: ${{ github.ref }}
          RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tags="$(git ls-remote --tags --refs origin | sed 's|.*refs/tags/||')"
          drafts="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft) | "\(.tag_name) \((.body // "") | (capture("publishing-run: (?<id>[0-9]+)").id)? // "unknown")"')"
          TAGS="$tags" DRAFTS="$drafts" ./scripts/release-version.sh

  # ── Nothing is built — so nothing is published — on red ─────────────────────────────────────
  test:
    name: Tests
    needs: version
    if: needs.version.outputs.build == 'true'
    uses: ./.github/workflows/test-shell.yml

  build:
    name: Build ${{ matrix.label }}
    needs: [version, test]
    if: needs.version.outputs.build == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux may run on our own runner (`CI_RUNNER_LABEL`); Windows and macOS stay on GitHub's
          # images because there is nowhere else to run them (no Windows images at Hetzner, macOS
          # needs Apple hardware). ERPlora/app is public, and the org Variable is visible only to
          # private repos, so today all three are GitHub-hosted.
          - os: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
            label: linux
          - os: windows-latest
            label: windows
          # `macos-latest` is Apple Silicon; the .dmg is NOT notarized while there is no Apple
          # certificate, so Gatekeeper asks for right click → Open the first time.
          - os: macos-latest
            label: macos
    steps:
      - uses: actions/checkout@v4

      # Tauri's system dependencies on Linux.
      #
      # ⚠️ The condition reads the LABEL, not `matrix.os`: on our runner `matrix.os` is
      # `self-hosted`, `== 'ubuntu-latest'` was false and this whole step was skipped (#848).
      #
      # The last two are not for compiling but for PACKAGING the AppImage — things the bundler takes
      # FROM THE MACHINE, so no project dependency can replace them:
      #   · `xdg-utils` → `/usr/bin/xdg-mime` and `/usr/bin/xdg-open`, which tauri-bundler COPIES
      #     into the AppDir (xdg-mime for the `erplora://` scheme; xdg-open because `bundleXdgOpen`
      #     defaults on). Without them: «xdg-mime binary not found», after the whole compile.
      #   · `libgtk-3-bin` → `gtk-query-immodules-3.0`, with which linuxdeploy's GTK plugin writes
      #     `immodules.cache` and then `sed -i`s it under `set -e`: missing tool, dead step.
      # GitHub's image carries both; a bare Ubuntu does not. Guarded by
      # `release_runner_assumptions.rs` (hub#878). Through the apt-lock wrapper: on a shared runner
      # another job may hold apt's lock (infra#313).
      - name: Install Linux build deps
        if: matrix.label == 'linux'
        run: |
          bash scripts/ci/apt-lock-retry.sh sudo apt-get update
          bash scripts/ci/apt-lock-retry.sh sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential \
            file \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            xdg-utils \
            libgtk-3-bin

      # No frontend is built here (hub#465): `tauri.conf.json` has no `beforeBuildCommand` because
      # `frontendDist` points at the committed static `shell-dist/` (ADR-0154). Guarded by
      # scripts/pack-msix.test.sh. `dtolnay/rust-toolchain` does NOT install rustup, it USES it: on
      # GitHub's runners it is always there; on our runner it is a file rust-cache's `Post` once
      # deleted (see below).
      - name: Bootstrap rustup (own runner)
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            echo "rustup missing on this runner — installing it"
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --no-modify-path --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable (branch head on 2026-10-14)

      # 🔴 `cache-bin: false`: this action's `Post` cleans `$CARGO_HOME/bin` and deletes the
      # runner's `rustup`, breaking the NEXT job on our own runner. Explained in `test-shell.yml`.
      #
      # 🔴 `save-if` off on our own runner, and not as an optimisation either. The same `Post` calls
      # `cleanRegistry`, which `rmRF`s every non-workspace directory under `~/.cargo/registry/src`.
      # This job and `build-android` run AT THE SAME TIME on `ci-runner-1` — two slots, one `$HOME`
      # — and the Android build includes `:tauri-android`, `:tauri-plugin-deep-link`,
      # `:tauri-plugin-notification` and `:tauri-plugin-opener` as Gradle projects living EXACTLY
      # there. Measured: «... Cleaning cargo registry ...» at 13:29:24 and 41 s later Android died
      # with «No variants exist» for those four (hub#878). `save-if: false` returns BEFORE cleaning,
      # so the restore still works and hosted runners still save.
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
          cache-bin: false
          save-if: ${{ runner.environment != 'self-hosted' }}

      # 🔴 The Tauri CLI comes from the WORKSPACE, not from `npm install -g` (hub#878).
      #
      # `tauri-action` only uses a package manager if the project DEPENDS on the CLI; otherwise it
      # falls back to `npm install -g @tauri-apps/cli@v2`, which writes to `/usr/lib/node_modules`
      # — the user's on a GitHub runner, root's on `ci-runner-1`: the Linux job of `v1.1.0` died
      # with `EACCES`. `package.json` pins the CLI in the lockfile (same exact version on the three
      # platforms) and installs it inside the workspace, where we can always write.
      # `--filter @erplora/app` keeps it to the CLI: no frontend is built here.
      - name: Node 22 + pnpm (pinned by package.json `packageManager`)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack
        run: corepack enable

      - name: Tauri CLI (workspace dependency, NOT global)
        run: pnpm install --frozen-lockfile --filter @erplora/app

      # `tauriScript` tells the action the CLI is already there: without it, back to the
      # `npm install -g` above. Without `tagName` it only builds (no GitHub release): the release
      # is created by `github-release`, after every channel published. The version is the one in
      # `tauri.conf.json`, as committed: nothing rewrites it.
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tauriScript: pnpm exec tauri

      # Collects the bundles (their names carry the version; they get the stable names the SaaS
      # serves from `latest/`). The target dir is the Cargo workspace's (repo root). Each platform
      # lists the bundles it MUST produce: one that did not come out is red here, where it is
      # built — not after Play and the Store already published the others.
      - name: Stage artifacts
        shell: bash
        env:
          PLATFORM: ${{ matrix.label }}
        run: |
          set -uo pipefail
          mkdir -p dist
          missing=0
          # $1 = name pattern, $2 = stable target name.
          expect() {
            local found
            found=$(find . -path '*/release/bundle/*' -name "$1" 2>/dev/null | head -1)
            if [ -z "$found" ]; then
              echo "::error::no $1 bundle was built on $PLATFORM: $2 would be missing from the release"
              missing=1
              return
            fi
            cp "$found" "dist/$2" || { echo "::error::cannot stage $found as dist/$2"; missing=1; return; }
            echo "  $found -> dist/$2"
          }
          case "$PLATFORM" in
            linux)   expect '*.AppImage' erplora-app.AppImage; expect '*.deb' erplora-app.deb ;;
            windows) expect '*-setup.exe' erplora-app-setup.exe; expect '*.msi' erplora-app.msi ;;
            macos)   expect '*.dmg' erplora-app.dmg ;;
            *)       echo "::error::unknown platform '$PLATFORM': no list of the bundles it must build"; exit 1 ;;
          esac
          echo "--- dist/ ---"; ls -la dist/
          [ "$missing" -eq 0 ] || exit 1

      # `retention-days` is NOT cosmetic: without it the artifact lives the repo maximum (90 days)
      # and the release of `v1.1.8` died of «Artifact storage quota has been hit», half published.
      # These bundles are intermediate: their consumers are the jobs of THIS run. 3 days leaves
      # room to download one by hand or to re-run a failed channel.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error
          retention-days: 3

      # ------------------------------------------------------------------------------
      # Microsoft Store channel (ADR-0136): an UNSIGNED MSIX (the Store re-signs it after
      # certification). Pure post-build over the exe this job just compiled. Only when the repo
      # has the Partner Center identity in its Variables (MSIX_IDENTITY_NAME · MSIX_PUBLISHER ·
      # MSIX_PUBLISHER_DISPLAY). Runbook: MICROSOFT-STORE.md
      # ------------------------------------------------------------------------------
      - name: Install winapp CLI
        if: matrix.os == 'windows-latest' && vars.MSIX_IDENTITY_NAME != ''
        run: winget install microsoft.winappcli --source winget --accept-source-agreements --accept-package-agreements --disable-interactivity

      - name: Pack MSIX (Store, unsigned)
        if: matrix.os == 'windows-latest' && vars.MSIX_IDENTITY_NAME != ''
        shell: pwsh
        run: |
          pwsh scripts/pack-msix.ps1 -Version '${{ needs.version.outputs.version }}' `
            -IdentityName '${{ vars.MSIX_IDENTITY_NAME }}' `
            -Publisher '${{ vars.MSIX_PUBLISHER }}' `
            -PublisherDisplay '${{ vars.MSIX_PUBLISHER_DISPLAY }}' `
            -OutDir dist-msix

      - name: Upload MSIX artifact
        if: matrix.os == 'windows-latest' && vars.MSIX_IDENTITY_NAME != ''
        uses: actions/upload-artifact@v4
        with:
          name: app-msix
          path: dist-msix/erplora-app.msix
          if-no-files-found: error
          retention-days: 3

  # ------------------------------------------------------------------------------
  # Android — the SAME Tauri app, not a separate one (ADR-0160/0180). Needs `gen/android`
  # committed: the AndroidManifest with the local network and notification permissions lives
  # there, and regenerating it would drop them.
  # ------------------------------------------------------------------------------
  build-android:
    name: Build android
    needs: [version, test]
    if: needs.version.outputs.build == 'true'
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # No pnpm/Node setup here (hub#465): the Android build is Rust + Kotlin and its CLI comes
      # from `cargo install tauri-cli` below. The plugin's Kotlin module compiles with jvmTarget 17.
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # This step downloads the command line tools from `dl.google.com` (the IPv4 preference in
      # the workflow `env` is what keeps it alive on `ci-runner-1`, hub#878).
      # Only `platform-tools`: the action's default is `tools platform-tools`, and Google retired
      # the legacy `tools` package on 2026-09-16 — `sdkmanager` exits 1 on it (hub#1881).
      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;27.1.12297006" "platforms;android-36" "build-tools;36.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"

      # Same reason as in the desktop job: the action below USES rustup, it does not install it.
      - name: Bootstrap rustup (own runner)
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            echo "rustup missing on this runner — installing it"
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --no-modify-path --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable (branch head on 2026-10-14)
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      # 🔴 `cache-bin: false`: see `test-shell.yml`; this job also runs `cargo install tauri-cli`,
      # which writes right into `$CARGO_HOME/bin`. 🔴 `save-if` off on our own runner: this job is
      # the VICTIM of the desktop job's `cleanRegistry` (explained there), and its own `Post` would
      # be the executioner in the opposite order.
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
          cache-bin: false
          save-if: ${{ runner.environment != 'self-hosted' }}

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      # SAME keystore and alias `erplora` as the Kotlin app (ADR-0053): without it an existing
      # install cannot update over it — Android refuses the signature change. Without the secrets
      # Gradle builds UNSIGNED (fine for a local build): an APK nobody can install and an AAB Play
      # rejects. So a missing secret is red HERE, naming it. The secrets reach the script through
      # `env:`, never pasted into its text.
      - name: Keystore (release signing, ADR-0053)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          bash scripts/ci/require-config.sh secret:ANDROID_KEYSTORE_BASE64 secret:ANDROID_KEYSTORE_PASSWORD
          cd src-tauri/gen/android
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > erplora.keystore
          {
            echo "storeFile=$(pwd)/erplora.keystore"
            echo "keyAlias=erplora"
            echo "password=$ANDROID_KEYSTORE_PASSWORD"
          } > keystore.properties

      # `ERPLORA_DISTRIBUTION=play` marks the binary as «distributed by Play» (hub#757): the shell
      # stops offering the APK download, which Google forbids an app from doing for itself.
      - name: Build APK + AAB
        env:
          ERPLORA_DISTRIBUTION: play
        run: cargo tauri android build --apk --aab

      # AFTER the build on purpose: `tauri.settings.gradle` — which includes the plugin module —
      # is GENERATED by the build and is not in git. These tests hold the per-API-level permission
      # logic and catch the two traps that leave an `invoke` hanging for ever.
      - name: Kotlin unit tests (permissions plugin)
        working-directory: src-tauri/gen/android
        run: ./gradlew :tauri-plugin-erplora-android:testDebugUnitTest

      # `versionCode` is a ONE-WAY door on Play: once published, that number is burned. Checked
      # against ADR-0160's formula on the REAL artifact, not on the config.
      - name: Check identity and versionCode
        run: |
          set -euo pipefail
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort | tail -1)
          APK=$(find . -name '*.apk' -path '*release*' | head -1)
          echo "APK: $APK"
          BADGING=$("$AAPT" dump badging "$APK")
          echo "$BADGING" | head -3
          echo "$BADGING" | grep -q "package: name='com.erplora.app'" \
            || { echo "::error::wrong identity (ADR-0160 requires com.erplora.app)"; exit 1; }
          VN=$(echo "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          VC=$(echo "$BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")
          EXPECTED=$(echo "$VN" | awk -F. '{print $1*1000000 + $2*1000 + $3}')
          echo "versionName=$VN versionCode=$VC expected=$EXPECTED"
          [ "$VC" = "$EXPECTED" ] \
            || { echo "::error::versionCode $VC != $EXPECTED (ADR-0160 formula)"; exit 1; }

      # The permissions, READ OFF THE APK (hub#337). It is the only place the MERGED manifest
      # exists: the Rust tests check the two source manifests, but that the merger really folds
      # them together is only visible here. Without ACCESS_LOCAL_NETWORK Android blocks the LAN
      # BELOW the API: the 9100 sweep times out, no error — it installs, starts and finds no
      # printer, and nobody reports it.
      - name: Check hardware permissions on the APK
        run: |
          set -euo pipefail
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort | tail -1)
          APK=$(find . -name '*.apk' -path '*release*' | head -1)
          PERMISSIONS=$("$AAPT" dump permissions "$APK")
          echo "$PERMISSIONS"
          for P in android.permission.INTERNET \
                   android.permission.ACCESS_NETWORK_STATE \
                   android.permission.CHANGE_WIFI_MULTICAST_STATE \
                   android.permission.ACCESS_LOCAL_NETWORK \
                   android.permission.POST_NOTIFICATIONS \
                   android.permission.BLUETOOTH_CONNECT \
                   android.permission.NFC \
                   android.permission.FOREGROUND_SERVICE \
                   android.permission.FOREGROUND_SERVICE_SPECIAL_USE \
                   android.permission.ACCESS_FINE_LOCATION \
                   android.permission.ACCESS_COARSE_LOCATION \
                   android.permission.RECORD_AUDIO \
                   android.permission.MODIFY_AUDIO_SETTINGS; do
            echo "$PERMISSIONS" | grep -q "name='$P'" \
              || { echo "::error::the APK does NOT declare $P — the hardware would die SILENTLY (hub#337)"; exit 1; }
          done
          # 🔴 The NFC permission drags an IMPLICIT requirement of `android.hardware.nfc` (hub#988):
          # Play hides the app from every device without the chip — the cheap counter tablets —
          # unless the manifest says it is optional. Only the MERGED manifest knows, and
          # `dump badging` reads it. The ` ?` of the pattern is not sloppiness: aapt1 prints
          # `uses-feature-not-required:name=` and aapt2 puts a space after the colon.
          BADGING=$("$AAPT" dump badging "$APK")
          echo "$BADGING" | grep -qE "uses-feature-not-required: ?name='android.hardware.nfc'" \
            || { echo "::error::the APK REQUIRES android.hardware.nfc — Play would hide it from tablets without the chip (hub#988)"; echo "$BADGING" | grep -i nfc; exit 1; }
          # Same risk with location (hub#2552): ACCESS_COARSE/FINE_LOCATION imply
          # `android.hardware.location` WHATEVER the targetSdk. The till does not need it.
          echo "$BADGING" | grep -qE "uses-feature-not-required: ?name='android.hardware.location'" \
            || { echo "::error::the APK REQUIRES android.hardware.location — Play would hide it from devices without location hardware (hub#2552)"; echo "$BADGING" | grep -i location; exit 1; }
          # Same risk with the microphone (hub#247): RECORD_AUDIO implies `android.hardware.microphone`
          # (aapt2, targetSdk 36). Dictating to the assistant is optional; the till sells without it.
          echo "$BADGING" | grep -qE "uses-feature-not-required: ?name='android.hardware.microphone'" \
            || { echo "::error::the APK REQUIRES android.hardware.microphone — Play would hide it from devices without a microphone (hub#247)"; echo "$BADGING" | grep -i microphone; exit 1; }

      # Both or red: `if-no-files-found: error` below only fires when NEITHER is there.
      - name: Stage artifacts
        run: |
          set -uo pipefail
          mkdir -p dist
          aab=$(find . -name '*.aab' -path '*release*' | head -1)
          apk=$(find . -name '*.apk' -path '*release*' | head -1)
          [ -n "$aab" ] || { echo "::error::no release AAB was built: erplora-app.aab (Google Play) would be missing"; exit 1; }
          [ -n "$apk" ] || { echo "::error::no release APK was built: erplora-app.apk would be missing from the release"; exit 1; }
          cp "$aab" dist/erplora-app.aab || exit 1
          cp "$apk" dist/erplora-app.apk || exit 1
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-android
          path: dist/*
          if-no-files-found: error
          retention-days: 3

  # ── Every installer is there, then the release is opened — BEFORE any channel publishes ──────
  # 1. The six installers and the AAB (and the MSIX when the Store is on) are all in this run's
  #    artifacts: a hole is red here, not after Play and the Store published the rest.
  # 2. The DRAFT release `v<version>` is opened, with the installers and the run that opened it.
  #    It is the mark that publication STARTED: from here on Play, the Store or S3 may hold this
  #    version, so the next run's `version` job refuses to publish the same number again (resume
  #    this run with `gh run rerun <id> --failed`, or bump). A draft has no tag: `github-release`
  #    publishes it after the gate, and that is what creates the tag.
  collect:
    name: Check installers + open draft release
    needs: [version, build, build-android]
    if: needs.version.outputs.release == 'true'
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download every artifact of this run
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Every installer is there
        env:
          STORE_ON: ${{ vars.MICROSOFT_STORE_PRODUCT_ID != '' }}
        run: |
          set -uo pipefail
          expected="erplora-app-setup.exe erplora-app.msi erplora-app.AppImage erplora-app.deb erplora-app.dmg erplora-app.apk erplora-app.aab"
          # `publish-store` publishes the MSIX: with the Store on, it is expected as well.
          if [ "$STORE_ON" = "true" ]; then expected="$expected erplora-app.msix"; fi
          missing=0
          for f in $expected; do
            if [ -f "artifacts/$f" ]; then
              echo "  ok $f"
            else
              echo "::error::artifacts/$f is missing: no channel publishes a release with a hole in it"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

      - name: Open the draft release (the mark that publication started)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          INSTALLERS="erplora-app-setup.exe erplora-app.msi erplora-app.AppImage erplora-app.deb erplora-app.dmg erplora-app.apk"
          files=()
          for f in $INSTALLERS; do files+=("artifacts/$f"); done
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # A re-run of THIS run: the version gate refuses a draft opened by any other run.
            gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "${files[@]}" --draft --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "ERPlora $VERSION" --generate-notes \
              --notes "<!-- publishing-run: $GITHUB_RUN_ID -->"
          fi
          echo "Draft release $TAG opened by run $GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"

  # ── Microsoft Store ─────────────────────────────────────────────────────────────────────────
  # Publishes the MSIX with the msstore CLI (FREE products only, which is our case). Prerequisites
  # (manual, once): the app published and LIVE in Partner Center + an Entra app with the Manager
  # role. Gated by the Variable MICROSOFT_STORE_PRODUCT_ID (empty = job skipped; the release gate
  # then fails unless `store` is declared in RELEASE_CHANNELS_PENDING). Every release goes through
  # Microsoft's certification (hours to 3 days) and the Store delivers the update by itself.
  # Like every publisher, it waits for `collect`: a channel never publishes before every installer
  # of the release is there and the draft release marks the publication as started.
  publish-store:
    name: Publish to Microsoft Store
    needs: [version, collect]
    if: needs.version.outputs.release == 'true' && vars.MICROSOFT_STORE_PRODUCT_ID != ''
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # The check below is bash: with `core.autocrlf=true` (Windows default) the checkout would
      # hand Git Bash a CRLF script.
      - name: Check out with LF
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      # An empty secret renders as an empty string and `msstore` then fails with an auth error that
      # never names it. Red here, naming each missing one.
      - name: Store credentials are set
        shell: bash
        env:
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY: ${{ vars.MSIX_PUBLISHER_DISPLAY }}
        run: >-
          bash scripts/ci/require-config.sh
          secret:AZURE_AD_TENANT_ID secret:SELLER_ID
          secret:AZURE_AD_APPLICATION_CLIENT_ID secret:AZURE_AD_APPLICATION_SECRET
          var:MSIX_IDENTITY_NAME var:MSIX_PUBLISHER var:MSIX_PUBLISHER_DISPLAY

      - name: Download MSIX
        uses: actions/download-artifact@v4
        with:
          name: app-msix
          path: artifacts

      - name: Configure Microsoft Store CLI
        uses: microsoft/microsoft-store-apppublisher@15abd1c50fcc164b19cb240fb04ef3c49bf715a2 # v1.1

      - name: Authenticate with Partner Center
        shell: pwsh
        env:
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
        run: |
          msstore reconfigure `
            --tenantId "$env:AZURE_AD_TENANT_ID" `
            --sellerId "$env:SELLER_ID" `
            --clientId "$env:AZURE_AD_APPLICATION_CLIENT_ID" `
            --clientSecret "$env:AZURE_AD_APPLICATION_SECRET"

      - name: Publish MSIX
        shell: pwsh
        run: msstore publish "${{ github.workspace }}/artifacts/erplora-app.msix" -id "${{ vars.MICROSOFT_STORE_PRODUCT_ID }}"

  # ── Google Play (hub#308) ────────────────────────────────────────────────────────────────────
  # Consumes the AAB `build-android` uploaded — it rebuilds nothing.
  #
  # ⚠️ The FIRST upload of an app is MANUAL (Google's rule: it registers the upload key). Gated by
  # the Variable `PLAY_PACKAGE_NAME` (empty = job skipped; the release gate then fails unless
  # `play` is declared in RELEASE_CHANNELS_PENDING).
  #
  # `PLAY_TRACK` picks the track and defaults to `internal` on purpose: this step uploads with
  # `status: completed`, a 100% rollout at once. `PLAY_TRACK=production` would send every release,
  # untested, to EVERY till at once — on a POS that is an incident, not a deployment. Automating
  # production needs a staged rollout (`status: inProgress` + `userFraction`) first.
  #
  # 🔴 `changesNotSentForReview: false` since 2026-08-19. With `true` the AAB lands as «Changes not
  # yet submitted for review» and waits for a click nobody knows is pending: 14 changes sat unsent
  # for five days while every tag went green. Guarded by `release_gate.rs`.
  #
  # The service account needs NO GCP IAM roles: it is invited in Play Console on this app with
  # «Release to testing tracks» and nothing else.
  publish-play:
    name: Publish to Google Play
    needs: [version, collect]
    if: needs.version.outputs.release == 'true' && vars.PLAY_PACKAGE_NAME != ''
    # `jarsigner` (JDK) is what this job takes from the image without installing it.
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      # For the two checks below: this job builds nothing.
      - uses: actions/checkout@v4

      # An empty secret would reach the upload action as an empty JSON and fail there without
      # naming it. Red here, with the command that sets it.
      - name: Play credentials are set
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: bash scripts/ci/require-config.sh secret:PLAY_SERVICE_ACCOUNT_JSON

      # Each release SENDS the app to review (`changesNotSentForReview: false` below), so the
      # account Google reviews with has to work BEFORE anything is uploaded (hub#1888). The control
      # signs in as the reviewer and demands a living hub with modules (hub#1718). No `if:` and no
      # `continue-on-error` on purpose: missing configuration is red `missing_credentials` naming
      # the variables, never a silent skip. Contract:
      # `scripts/tests/play-reviewer-preflight-on-publish.test.sh`.
      - name: Google's reviewer account signs in and lands on a living hub
        env:
          PLAY_REVIEWER_EMAIL: ${{ vars.PLAY_REVIEWER_EMAIL }}
          PLAY_REVIEWER_HUB: ${{ vars.PLAY_REVIEWER_HUB }}
          PLAY_REVIEWER_PASSWORD: ${{ secrets.PLAY_REVIEWER_PASSWORD }}
        run: python3 scripts/ci/play-reviewer-preflight.py

      - name: Download AAB
        uses: actions/download-artifact@v4
        with:
          name: app-android
          path: artifacts

      # The uploaded AAB has to be THE build's, signed with ADR-0053's keystore. Play would reject
      # an unsigned one with an error that does not say so — stop it here, naming the cause.
      - name: Check that the AAB is signed
        run: |
          set -euo pipefail
          AAB=artifacts/erplora-app.aab
          [ -f "$AAB" ] || { echo "::error::no $AAB in the app-android artifact"; exit 1; }
          jarsigner -verify "$AAB" | grep -q "jar verified" \
            || { echo "::error::the AAB is NOT signed — was ANDROID_KEYSTORE_BASE64 missing in the build?"; exit 1; }
          echo "AAB signed ✓"

      - name: Publish to Google Play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ vars.PLAY_PACKAGE_NAME }}
          releaseFiles: artifacts/erplora-app.aab
          track: ${{ vars.PLAY_TRACK || 'internal' }}
          status: completed
          changesNotSentForReview: false

  # ── S3: the installers and the update manifest (AWS, by OIDC) ────────────────────────────────
  # No static keys: GitHub's OIDC token is exchanged for the role `AWS_DOWNLOADS_ROLE_ARN`
  # (aws-next, PLAN-AWS ronda 18), which can write `downloads/app/*` of `DOWNLOADS_BUCKET`. Until
  # both Variables exist the upload is skipped OUT LOUD (warning + summary) and reported to the gate
  # as `skipped`, so it shows as «declared pending» or red — never as «published».
  upload-s3:
    name: Upload to S3 (installers + latest.json)
    needs: [version, collect]
    if: needs.version.outputs.release == 'true'
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    # A hung `aws s3 cp` must not hold the run for hours: fail fast and re-run this job alone
    # (`gh run rerun --failed`, the artifacts persist).
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    outputs:
      result: ${{ steps.skipped.outputs.result || steps.upload.outputs.result }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      DOWNLOADS_BUCKET: ${{ vars.DOWNLOADS_BUCKET }}
    steps:
      - name: S3 not configured — installers go to the GitHub Release only
        id: skipped
        if: vars.AWS_DOWNLOADS_ROLE_ARN == '' || vars.DOWNLOADS_BUCKET == ''
        run: |
          msg="S3 upload skipped: AWS_DOWNLOADS_ROLE_ARN/DOWNLOADS_BUCKET not set"
          echo "::warning::$msg. The installers of v${VERSION} still go to the GitHub Release, but latest.json — the in-app update channel — is NOT updated until aws-next creates the bucket and the OIDC role (PLAN-AWS ronda 18) and the two repo Variables are set."
          {
            echo "## $msg"
            echo
            echo "The installers of **v${VERSION}** are attached to the GitHub Release instead."
            echo "\`downloads/app/latest/latest.json\` (what \`GET /api/v1/app/release/\` reads) is **not** updated."
            echo "Set the repo Variables \`AWS_DOWNLOADS_ROLE_ARN\` and \`DOWNLOADS_BUCKET\` once aws-next creates them, then remove \`s3\` from \`RELEASE_CHANNELS_PENDING\`."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "result=skipped" >> "$GITHUB_OUTPUT"

      # For scripts/ci/s3-version-guard.sh. BEFORE the download: checkout cleans the workspace.
      - name: Checkout
        if: vars.AWS_DOWNLOADS_ROLE_ARN != '' && vars.DOWNLOADS_BUCKET != ''
        uses: actions/checkout@v4

      - name: Download artifacts
        if: vars.AWS_DOWNLOADS_ROLE_ARN != '' && vars.DOWNLOADS_BUCKET != ''
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: AWS credentials (OIDC)
        if: vars.AWS_DOWNLOADS_ROLE_ARN != '' && vars.DOWNLOADS_BUCKET != ''
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_DOWNLOADS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # The manifest (hub#400): an installer does not say which version it is (the name in
      # `latest/` is fixed), so without `latest.json` there is nothing the installed app can
      # compare against — and a till without news looks exactly like a healthy one. Written in the
      # SAME step as the installers and LAST, so `latest/` never announces a version whose
      # installer is not there yet. `version` is without the `v`, identical to `tauri.conf.json`,
      # which is what `plugin:app|version` returns on the device.
      #
      # The versioned `latest.json` carries the run that wrote it (`run-id`). Before the first copy
      # the guard refuses a version ANOTHER run already put here: re-uploading it would replace
      # what the fleet downloads with a different build under the same number. A re-run of this
      # same run resumes (same `github.run_id`).
      - name: Upload installers and latest.json to S3
        id: upload
        if: vars.AWS_DOWNLOADS_ROLE_ARN != '' && vars.DOWNLOADS_BUCKET != ''
        run: |
          set -euo pipefail
          bash scripts/ci/s3-version-guard.sh
          INSTALLERS="erplora-app-setup.exe erplora-app.msi erplora-app.AppImage erplora-app.deb erplora-app.dmg erplora-app.apk"
          for f in $INSTALLERS; do
            [ -f "artifacts/$f" ] || { echo "::error::artifacts/$f is missing: every build succeeded, so a bundle was not staged — publishing without it would leave latest/ half old"; exit 1; }
          done
          for f in $INSTALLERS; do
            aws s3 cp "artifacts/$f" "s3://${DOWNLOADS_BUCKET}/downloads/app/v${VERSION}/$f"
          done
          printf '{"version":"%s","published_at":"%s"}\n' \
            "$VERSION" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > latest.json
          cat latest.json
          aws s3 cp latest.json "s3://${DOWNLOADS_BUCKET}/downloads/app/v${VERSION}/latest.json" \
            --content-type application/json --metadata "run-id=${GITHUB_RUN_ID}"
          for f in $INSTALLERS; do
            aws s3 cp "s3://${DOWNLOADS_BUCKET}/downloads/app/v${VERSION}/$f" \
              "s3://${DOWNLOADS_BUCKET}/downloads/app/latest/$f"
          done
          aws s3 cp latest.json "s3://${DOWNLOADS_BUCKET}/downloads/app/latest/latest.json" \
            --content-type application/json
          echo "Uploaded to s3://${DOWNLOADS_BUCKET}/downloads/app/v${VERSION}/ and latest/" >> "$GITHUB_STEP_SUMMARY"
          echo "result=success" >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------------------
  # Release gate (hub#895) — a green release has to mean «published».
  #
  # Every publishing job is gated by a repo Variable, and an empty Variable leaves the job
  # `skipped` — which does not colour a run: three releases in a row (the last v1.0.3, hub#839)
  # ended GREEN publishing nothing. This job looks at the result of ALL the others:
  #   · channel published                         → fine
  #   · channel skipped, its Variable empty       → RED, naming the Variable
  #   · channel DECLARED pending                  → green, but said out loud
  #   · channel failure/cancelled                 → RED (a declaration excuses a skip, never a failure)
  #   · channel with no gating Variable           → mandatory, cannot be declared pending
  #
  # Declaring a channel = Variable `RELEASE_CHANNELS_PENDING` (comma list: `store`, `play`, `s3`).
  # S3 is gated by its two Variables and reported by what the upload REALLY did
  # (`outputs.result`), so a skipped upload never reads as published.
  #
  # The decision lives in `scripts/release-gate.sh` (tested by `scripts/release-gate.test.sh`); the
  # wiring — `always()`, the complete `needs`, every result reaching the script — is guarded by
  # `src-tauri/tests/release_gate.rs`.
  # ------------------------------------------------------------------------------
  release-gate:
    name: Release gate
    needs: [version, test, build, build-android, collect, publish-store, publish-play, upload-s3]
    # `always()` is the point: without it the gate inherits «only if every `needs` succeeded» and
    # the skipped jobs would skip it too. Only on a release: a docs push or a dispatch with
    # `publish=false` publishes nothing on purpose.
    if: always() && needs.version.outputs.release == 'true'
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check that every expected channel actually published
        shell: bash
        env:
          RELEASE_CHANNELS_PENDING: ${{ vars.RELEASE_CHANNELS_PENDING }}
          # id | name | job result | gating Variable | set? | reference
          # No gating Variable = MANDATORY channel (cannot be declared pending).
          CHANNELS: |
            store|Microsoft Store|${{ needs.publish-store.result }}|MICROSOFT_STORE_PRODUCT_ID|${{ vars.MICROSOFT_STORE_PRODUCT_ID != '' }}|hub#392
            play|Google Play|${{ needs.publish-play.result }}|PLAY_PACKAGE_NAME|${{ vars.PLAY_PACKAGE_NAME != '' }}|hub#308
            s3|S3 downloads (latest.json)|${{ needs.upload-s3.outputs.result || needs.upload-s3.result }}|AWS_DOWNLOADS_ROLE_ARN/DOWNLOADS_BUCKET|${{ vars.AWS_DOWNLOADS_ROLE_ARN != '' && vars.DOWNLOADS_BUCKET != '' }}|hub#400
          # id | name | job result
          BUILDS: |
            version|Version gate|${{ needs.version.result }}
            test|Tests (test-shell.yml)|${{ needs.test.result }}
            build|Desktop bundles (linux/windows/macos)|${{ needs.build.result }}
            build-android|Android AAB + APK|${{ needs.build-android.result }}
            collect|Installers check + draft release|${{ needs.collect.result }}
        run: ./scripts/release-gate.sh

  # ── The tag and the GitHub Release: the LAST step ───────────────────────────────────────────
  # The tag `v<version>` is what tells the next push «already released». So it is written only
  # once the gate is green: a tag on a half-published release would turn «re-run the failed job»
  # into «nothing to do». `always()` because a channel declared pending is a SKIPPED ancestor, and
  # the implicit `success()` would skip this job too; the explicit gate result is the guard.
  #
  # The release already exists as the DRAFT `collect` opened, with the installers attached and its
  # target on the commit that was built: publishing it is what creates the tag. The direct
  # downloads live there even while S3 is not configured.
  github-release:
    name: Tag + GitHub Release
    needs: [version, release-gate]
    if: always() && needs.version.outputs.release == 'true' && needs.release-gate.result == 'success'
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Publish the draft release (this creates the tag)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          echo "## Released $TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
