[package]
name = "erplora-peripherals"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros", "io-util"] }
tracing = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
mdns-sd = "0.11"
if-addrs = "0.13"    # the device's own addresses: which networks to sweep, without a route out (app#17)
oem_cp = "2"          # cp437 encoding for escpos::text

# Inherits `[workspace.lints]` from the root manifest. Without these two lines the crate is
# silently EXEMPT from the lint gate.
[lints]
workspace = true
