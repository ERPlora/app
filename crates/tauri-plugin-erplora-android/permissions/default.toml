# Granted by default because none of these is dangerous on its own: asking for a permission is
# harmless, while being unable to ask leaves the hardware dead with nobody knowing why. Leaving the
# app does what the system Back does on the root screen, opening the app's settings page still
# leaves the decision to the person, keeping the app listening shows Android's ongoing
# notification, and the system voice only reads what the person asked to hear (the Android WebView
# has no `speechSynthesis`).
# The app grants this set to every page under erplora.com, but registers the plugin behind its
# linked-hub gate (`init(gate)`): any other page gets `not_the_linked_hub` and no command runs.
"$schema" = "schemas/schema.json"

[default]
description = "Check and request the runtime permissions the till needs on Android, leave the app with the Back button, open the app's page in the system settings, keep listening for notices with the screen off and read the assistant's answers aloud in the system voice."
permissions = ["allow-check-permissions", "allow-request-permissions", "allow-leave-app", "allow-open-app-settings", "allow-keep-listening", "allow-tts-available", "allow-tts-speak", "allow-tts-stop"]
