# The shell's Android plugin: how the Tauri shell carries Kotlin code to the device, for what Rust
# cannot reach on Android (runtime permissions, Bluetooth printing, NFC, notices, downloads…).
[package]
name = "tauri-plugin-erplora-android"
version = "0.0.0"
edition = "2021"
license = "MIT"
description = "Permisos de runtime de Android para el shell de ERPlora"
# `tauri-plugin` requires it to equal the package name: it is the key Tauri uses to tie the compiled
# Android module to this crate.
links = "tauri-plugin-erplora-android"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
# The bluetooth print payload crosses the JNI boundary as base64, same reasoning as the shell's
# `save_download`: ~1.3x the bytes instead of ~4x as a JSON number array.
base64 = "0.22"

# Inherits `[workspace.lints]` from the root manifest. Without these two lines the crate is
# silently EXEMPT from the lint gate.
[lints]
workspace = true
