# The ERPlora shell: a THIN native client (Tauri v2).
#
# The webview loads the SaaS onboarding and then the hub PWA (`hub_url`); local hardware goes
# through `invoke` handlers over `erplora-peripherals` (the shell IS the hardware bridge).
# NO embedded runtime, NO SQLite, NO entitlement gate: this crate does not depend on
# `erplora-server` or `erplora-cloud-client` (`tests/shell_surface.rs` keeps it that way).

[package]
name = "erplora-tauri"
edition = "2021"
version = "0.0.0"
license = "MIT"
description = "ERPlora Shell — thin desktop client (Tauri v2): SaaS onboarding + cloud hub PWA in a webview, local hardware via invoke"

[lib]
name = "erplora_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# POS hardware (ESC/POS network printers + cash drawer): the shell IS the bridge, and its hardware
# `invoke` handlers delegate to this crate, in-process. The JSON contract
# (`protocol::{PrinterInfo,Device}`) matches the SDK.
erplora-peripherals = { path = "../crates/peripherals" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
# Channels of the PrintQueue worker and the watchdog (the shell's background tasks). `time` is for
# the connectivity guard: it waits with backoff on a `Notify` while the network is down, and with
# no timer at all while everything is fine.
tokio = { version = "1", features = ["sync", "time"] }
# Stable per-installation `device.id` (the login's X-Device-Id, one session per device).
uuid = { version = "1", features = ["v4"] }
# SYSTEM notifications: the notice for when NOBODY is looking at the screen (an order for the
# kitchen). Official plugin; it covers Windows/macOS/Linux and Android/iOS with the same API, so
# the shell exposes a single `erplora_notify` command for every platform.
tauri-plugin-notification = "2"
# Android RUNTIME permissions. Without them the hardware is dead and fails SILENTLY: discovery
# returns [] and notifications do not go out, without a single error.
tauri-plugin-erplora-android = { path = "../crates/tauri-plugin-erplora-android" }
# Only to ask the remembered hub at start-up whether it still exists (`should_forget_hub`).
# Without it, a deleted hub walls the app into a permanent 404 with no way out through the UI.
# Same spec as the rest of the workspace, so it adds no new compilation.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# Rust's `eprintln!` does NOT reach logcat on Android: without this, a failure of the
# remembered-hub check is invisible, which is how a check that never runs goes unnoticed.
log = "0.4"
# Deep link `erplora://`. Registration is what makes a link from the SaaS open the
# APP, and each platform learns about the scheme somewhere else: Windows from a registry key and
# Linux from a `.desktop` handler, both written by the BUNDLER at install time from
# `plugins.deep-link.desktop.schemes`; macOS/iOS from `CFBundleURLTypes` in the bundle; Android
# from the intent filter in `AndroidManifest.xml`. Doing that by hand is where the plugin earns its
# place — and it is also the only portable way to receive the URL once the app is running.
tauri-plugin-deep-link = "2"
# The user's own browser. The webview opens NO window of its own, so `window.open` from the page
# is a silent no-op — and behind it are the buttons that charge: the module checkout, which lives
# OUTSIDE the app because Google Play does not allow paying for digital goods inside it, the plans
# page, the billing portal. Official
# plugin: `ACTION_VIEW` on Android, the desktop opener elsewhere. Only its Rust api is used; no
# `opener:*` permission reaches a page (`tests/remote_acl.rs`).
tauri-plugin-opener = "2"
# `save_download`: the page holds the bytes (it fetched them with the hub session) and the
# shell holds the disk, so they cross the `invoke` boundary. base64 and not a JSON array of numbers:
# a 5 MB export is ~6.7 MB of text this way and ~20 MB the other, on a tablet.
base64 = "0.22"

[dev-dependencies]
# `tests/remote_acl.rs` validates the patterns of `capabilities/default.json` with the SAME engine
# Tauri uses at run time (`RemoteUrlPattern`), instead of reimplementing the matching in the test.
tauri-utils = "2"
# `test` gives us `tauri::test::mock_builder` + `MockRuntime`, whose `navigate()` records the URL
# and whose `url()` answers with it. That is what lets `connectivity`'s regression test assert the
# window MOVED to our offline page and back instead of asserting on a bool. Dev-only:
# with resolver 2 this feature never reaches the shipped binary.
tauri = { version = "2", features = ["test"] }

# Desktop only. On Windows and Linux the OS answers a link by LAUNCHING the executable again with
# the URL appended, so without this a click would start a SECOND till on top of the first one
# instead of steering the one already open. Mobile has no such thing (`singleTask` + the intent
# does it), hence the target gate.
#
# The cfg is spelled out per-OS and not as `cfg(desktop)`: that alias is a rustc cfg emitted by
# `tauri-build`, and Cargo does not know it when resolving dependencies — it would silently drop
# the crate and the `#[cfg(desktop)]` code would stop compiling.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# «Start on login»: opt-in autostart for the dedicated desktop till, so
# there is always a print host draining the hub's queue. The OS keeps the state (LaunchAgent /
# registry / autostart dir); the shell only exposes enable/disable/is_enabled over `invoke`.
tauri-plugin-autostart = "2"
# The question before a link links another hub, in the system's own dialog: the page is exactly
# who must not be able to answer it. `rfd` and not `tauri-plugin-dialog`: that plugin's
# `init` replaces `window.alert`/`window.confirm` on EVERY page with its own commands, which the hub's
# pages are not granted — their `confirm()` would come back as a (truthy) promise. GTK on Linux, like
# the webview; `common-controls-v6` gives the Windows dialog its «Open»/«Cancel» buttons.
rfd = { version = "0.16", default-features = false, features = ["gtk3", "common-controls-v6"] }
# The system's language for that question: Spanish unless it says otherwise.
sys-locale = "0.3"

# A click on a notice on the computer. The notification plugin shows a desktop notice and
# drops its handle, so no click ever comes back; the shell shows it itself and waits for the click.
# macOS talks to `mac-notification-sys` directly: `notify-rust` only waits there when the notice has
# buttons. Windows shows the notice through WinRT itself, so the notice can carry the link a click
# in the Action Center launches the app with; `notify-rust` cannot set it. All three are
# already in the tree through the plugin, at these versions.
[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Data_Xml_Dom", "UI_Notifications"] }

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd"))'.dependencies]
notify-rust = "4.18"

# Inherits `[workspace.lints]` from the root manifest. Without these two lines the
# crate is silently EXEMPT from the lint gate.
[lints]
workspace = true
